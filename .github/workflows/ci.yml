name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --coverage
      - name: Build and smoke-test the stdio server
        run: |
          npm run build
          SEED_AS_OF=2026-10-31 npm run seed
          npm run smoke
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t loan-portfolio-mcp:ci .
      - name: Start container and check health + auth
        run: |
          docker run -d --name mcp -p 3000:3000 \
            -e AUTH_JWT_SECRET=ci-secret-ci-secret-ci-secret-ci-secret \
            -e AUTH_ISSUER=https://ci -e AUTH_AUDIENCE=loan-portfolio-mcp \
            loan-portfolio-mcp:ci
          for i in $(seq 1 30); do curl -fs localhost:3000/healthz && break; sleep 1; done
          curl -fs localhost:3000/healthz
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3000/mcp -H 'content-type: application/json' -d '{}')
          test "$code" = "401"
      - if: always()
        run: docker logs mcp || true
